org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Pub packages live on C: while this project lives on D:. Kotlin's incremental
# cache cannot relativize sources across Windows drive roots, so keep Android
# builds deterministic by compiling Kotlin without relocatable IC caches.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
